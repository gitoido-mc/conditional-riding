modLoader = "kotlinforforge"
loaderVersion = "[${neoforge_kotlin_version},)"
issueTrackerURL = "https://github.com/gitoido-mc/conditional-riding/issues"
license = '''GPL-3.0-only'''

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Conditional Riding for Cobblemon"
authors = "Gito"
description = '''
Allows to configure ability to ride pokemans via simple config!
'''
logoFile = "assets/${mod_id}/icon.png"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
mandatory = true
versionRange = "[${neoforge_loader_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "cobblemon"
mandatory = true
versionRange = "[${cobblemon_version},1.9.0)"
ordering = "AFTER"
side = "BOTH"
